name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python syntax and formatting helpers
        run: |
          python -m py_compile mini_calculator.pyw
          python -m unittest discover -s tests -v

      - name: Build portable executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MiniCalculator --icon mini_calc.ico --add-data "mini_calc.ico;." --add-data "default_calculator_state.txt;." --hidden-import pystray._win32 mini_calculator.pyw
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/MiniCalculator.exe release/MiniCalculator.exe

      - name: Build fast-start package
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MiniCalculator-Fast --icon mini_calc.ico --add-data "mini_calc.ico;." --add-data "default_calculator_state.txt;." --hidden-import pystray._win32 mini_calculator.pyw
          Compress-Archive -Path dist/MiniCalculator-Fast/* -DestinationPath release/MiniCalculator-Fast.zip -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Calculator-Windows
          path: release/*

      - name: Publish current release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.0 release/* --clobber
          } else {
            gh release create v1.1.0 release/* --generate-notes --title "Mini Calculator v1.1.0" --target "${{ github.sha }}"
          }

      - name: Publish tagged release
        if: github.ref_type == 'tag' && github.ref_name != 'v1.1.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --generate-notes --title "Mini Calculator ${{ github.ref_name }}"
